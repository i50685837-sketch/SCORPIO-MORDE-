<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCORPIO MORDE | Protocol Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #06010a; --purple-core: #7b1fa2; --neon-violet: #cf26ff;
            --bright-magenta: #f038ff; --dark-card: rgba(18, 4, 33, 0.85);
            --danger-glow: rgba(207, 38, 255, 0.4); --danger-red: #ff0055;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(123, 31, 162, 0.25) 0%, transparent 60%),
                radial-gradient(circle at 80% 20%, rgba(207, 38, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 20% 80%, rgba(15, 2, 28, 0.9) 0%, transparent 50%);
            color: #ffffff; font-family: 'Rajdhani', sans-serif; min-height: 100vh;
            display: flex; align-items: center; justify-content: center; overflow-x: hidden; position: relative; padding: 20px;
        }
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%; pointer-events: none; z-index: 10;
        }
        .container {
            width: 100%; max-width: 460px; padding: 35px 30px; background: var(--dark-card);
            border: 1px solid var(--neon-violet); box-shadow: 0 0 35px var(--danger-glow), inset 0 0 15px rgba(207, 38, 255, 0.2);
            border-radius: 4px; position: relative; z-index: 20; backdrop-filter: blur(10px);
            clip-path: polygon(0 0, 93% 0, 100% 7%, 100% 100%, 7% 100%, 0 93%);
        }
        .container::before {
            content: "SEC_LEVEL: EXTREME"; position: absolute; top: 6px; right: 15px;
            font-family: 'Orbitron', sans-serif; font-size: 0.6rem; color: var(--bright-magenta); letter-spacing: 2px;
        }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; font-weight: 900; letter-spacing: 3px; text-shadow: 0 0 12px var(--neon-violet); text-transform: uppercase; }
        .header p { font-size: 0.8rem; color: var(--neon-violet); letter-spacing: 2px; font-family: 'Share Tech Mono', monospace; }
        .form-group { margin-bottom: 18px; position: relative; }
        label { display: block; font-family: 'Share Tech Mono', monospace; font-size: 0.75rem; color: #a78bfa; letter-spacing: 1px; margin-bottom: 6px; text-transform: uppercase; }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%; padding: 12px 15px; background: rgba(6, 1, 10, 0.9);
            border: 1px solid rgba(207, 38, 255, 0.4); color: #fff; font-family: 'Rajdhani', sans-serif;
            font-size: 1rem; letter-spacing: 1px; outline: none; transition: all 0.3s ease;
        }
        input:focus { border-color: var(--bright-magenta); box-shadow: 0 0 12px var(--bright-magenta); }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin: 20px 0; }
        .checkbox-group input { appearance: none; width: 16px; height: 16px; border: 1px solid var(--neon-violet); background: rgba(6, 1, 10, 0.9); cursor: pointer; }
        .checkbox-group input:checked { background: var(--bright-magenta); box-shadow: 0 0 10px var(--bright-magenta); }
        .checkbox-group label { margin-bottom: 0; cursor: pointer; font-size: 0.8rem; color: #d8b4fe; }
        .btn-register {
            width: 100%; padding: 14px; background: transparent; border: 1px solid var(--neon-violet);
            color: #fff; font-family: 'Orbitron', sans-serif; font-size: 0.9rem; font-weight: 800;
            letter-spacing: 3px; cursor: pointer; text-transform: uppercase; transition: all 0.3s ease;
        }
        .btn-register:hover { background: var(--neon-violet); color: #000; box-shadow: 0 0 25px var(--neon-violet); }
        .login-link { text-align: center; margin-top: 20px; font-size: 0.85rem; font-family: 'Share Tech Mono', monospace; }
        .login-link a { color: var(--bright-magenta); text-decoration: none; letter-spacing: 1px; }
        .processing-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(6, 1, 10, 0.96); z-index: 50; padding: 30px 20px;
            flex-direction: column; justify-content: center; text-align: center;
        }
        .hash-title { font-family: 'Orbitron', sans-serif; color: var(--danger-red); font-size: 1.1rem; letter-spacing: 2px; text-shadow: 0 0 10px var(--danger-red); margin-bottom: 15px; animation: pulse-red 1s infinite alternate; }
        @keyframes pulse-red { 0% { opacity: 0.7; } 100% { opacity: 1; text-shadow: 0 0 20px var(--danger-red); } }
        .hash-stream { font-family: 'Share Tech Mono', monospace; font-size: 0.75rem; color: #a78bfa; background: #000; border: 1px solid var(--purple-core); padding: 12px; height: 110px; overflow: hidden; text-align: left; margin-bottom: 20px; word-break: break-all; line-height: 1.4; }
        .progress-bar-wrapper { width: 100%; height: 8px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--neon-violet); margin-bottom: 10px; }
        .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, var(--danger-red), var(--bright-magenta)); box-shadow: 0 0 15px var(--bright-magenta); transition: width 0.1s linear; }
        .status-msg { font-family: 'Orbitron', sans-serif; font-size: 0.75rem; color: #fff; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SCORPIO MORDE</h1>
            <p>[ INITIATE_NEW_NODE_HASH ]</p>
        </div>
        <form id="register-form">
            <div class="form-group"><label for="fullname">> FULL_NAME [STRING_HEX]</label><input type="text" id="fullname" required placeholder="Ex: Alex Vance"></div>
            <div class="form-group"><label for="email">> EMAIL_ADDRESS [ADDR_V4]</label><input type="email" id="email" required placeholder="node@scorpiomorde.io"></div>
            <div class="form-group"><label for="password">> NEW_PASSWORD [ENTROPY_256]</label><input type="password" id="password" required placeholder="••••••••••••"></div>
            <div class="form-group"><label for="confirm-password">> CONFIRM_PASSWORD [RE_HASH]</label><input type="password" id="confirm-password" required placeholder="••••••••••••"></div>
            <div class="checkbox-group"><input type="checkbox" id="terms" required><label for="terms">ACCEPT PROTOCOL TERMS & BINDINGS</label></div>
            <button type="submit" class="btn-register">EXECUTE REGISTER</button>
        </form>
        <div class="login-link">HAVE AN ACC? <a href="login.html">LOGIN_NODE</a></div>
        <div class="processing-overlay" id="processing-screen">
            <div class="hash-title">⚠ HASHING CREDENTIALS ⚠</div>
            <div class="hash-stream" id="hash-log">[INITIATING SHA3-512...]</div>
            <div class="progress-bar-wrapper"><div class="progress-bar" id="progress"></div></div>
            <div class="status-msg" id="status-text">CALCULATING PROOF OF WORK...</div>
        </div>
    </div>
    <script>
        const form = document.getElementById('register-form'), overlay = document.getElementById('processing-screen'), progressBar = document.getElementById('progress'), hashLog = document.getElementById('hash-log'), statusText = document.getElementById('status-text');
        function generateRandomHash(l) {
            const c = '0123456789ABCDEF89abcdef'; let r = '0x';
            for (let i = 0; i < l; i++) r += c.charAt(Math.floor(Math.random() * c.length));
            return r;
        }
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            if (document.getElementById('password').value !== document.getElementById('confirm-password').value) {
                alert("ERR_HASH_MISMATCH: Passwords do not match."); return;
            }
            overlay.style.display = 'flex';
            let elapsed = 0; const duration = 5000, intervalTime = 60;
            const hashInterval = setInterval(() => {
                elapsed += intervalTime;
                const percentage = Math.min((elapsed / duration) * 100, 100);
                progressBar.style.width = percentage + '%';
                hashLog.innerHTML += `<br>> HASH: ${generateRandomHash(32)}`;
                hashLog.scrollTop = hashLog.scrollHeight;
                if (percentage > 25 && percentage < 55) statusText.textContent = "INJECTING SALT & PEPPER...";
                else if (percentage >= 55 && percentage < 85) statusText.textContent = "WRITING PROTOCOL TO NODE...";
                else if (percentage >= 85) statusText.textContent = "ACCESS GRANTED. AUTHORIZING...";
                if (elapsed >= duration) { clearInterval(hashInterval); window.location.href = 'dashboard.html'; }
            }, intervalTime);
        });
    </script>
</body>
</html>
